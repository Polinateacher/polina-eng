<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alias — набор 2</title>
<style>
  :root {
    --blue: #2E5C8A;
    --blue-light: #e6f1fb;
    --gray: #888;
    --border: #e0e0e0;
    --done-bg: #f5f5f5;
    --done-text: #bbb;
    --radius: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f4f4;
    min-height: 100vh;
  }

  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-size: 17px;
    font-weight: 600;
    color: #1a1a1a;
  }

  .counter {
    font-size: 13px;
    color: var(--gray);
  }

  .reset-btn {
    font-size: 13px;
    color: var(--blue);
    background: none;
    border: 1px solid var(--blue);
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    margin-top: 10px;
    width: 100%;
  }

  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--blue);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    padding: 12px;
  }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 12px 12px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, opacity 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    min-height: 120px;
    justify-content: center;
    position: relative;
  }

  .card:active { opacity: 0.7; }

  .card.done {
    background: var(--done-bg);
    border-color: #e0e0e0;
  }

  .word {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a1a;
    line-height: 1.2;
    transition: color 0.15s;
  }

  .card.done .word {
    color: var(--done-text);
    text-decoration: line-through;
    text-decoration-color: #bbb;
    text-decoration-thickness: 2px;
  }

  .phonetic {
    font-size: 11px;
    color: #aaa;
    font-style: italic;
  }

  .card.done .phonetic { color: #ccc; }

  .translation {
    font-size: 13px;
    color: var(--blue);
    font-weight: 500;
    margin-top: 2px;
    transition: color 0.15s;
  }

  .card.done .translation { color: #ccc; }

  .example {
    font-size: 11px;
    color: #999;
    font-style: italic;
    line-height: 1.4;
    margin-top: 3px;
  }

  .card.done .example { color: #ccc; }

  .check {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 16px;
    display: none;
  }

  .card.done .check { display: block; }

  .all-done {
    display: none;
    text-align: center;
    padding: 24px 16px;
    color: var(--gray);
    font-size: 15px;
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1>Alias — набор 2</h1>
    <span class="counter" id="counter">0 / 30</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <button class="reset-btn" onclick="resetAll()">↺ Сбросить все</button>
</header>

<div class="grid" id="grid"></div>
<div class="all-done" id="allDone">🎉 Все слова угаданы! Нажми «Сбросить», чтобы играть снова.</div>

<script>
const words = [
  { w: "microwave", p: "/ˈmaɪkrəweɪv/", t: "микроволновка", e: "I heated up the lasagna in the microwave." },
  { w: "sweater", p: "/ˈswɛtər/", t: "свитер", e: "She wore an ugly Christmas sweater." },
  { w: "pool", p: "/puːl/", t: "бассейн", e: "We spent the whole afternoon in the pool." },
  { w: "chorus", p: "/ˈkɔːrəs/", t: "припев", e: "Everyone sang along when the chorus dropped." },
  { w: "squad", p: "/skwɒd/", t: "компания, тусовка", e: "I'm going to the beach with my squad." },
  { w: "record", p: "/ˈrɛkərd/", t: "запись; записывать", e: "I always record my lessons to review them later." },
  { w: "focus", p: "/ˈfoʊkəs/", t: "сосредотачиваться", e: "Try to focus on one task at a time." },
  { w: "cashier", p: "/kæˈʃɪər/", t: "кассир", e: "The cashier took forever to process my order." },
  { w: "hungover", p: "/ˈhʌŋˌoʊvər/", t: "с похмелья", e: "I was so hungover I couldn't get out of bed." },
  { w: "freezer", p: "/ˈfriːzər/", t: "морозилка", e: "Don't forget to take the chicken out of the freezer." },
  { w: "question", p: "/ˈkwɛstʃən/", t: "вопрос; сомневаться", e: "I started to question everything." },
  { w: "wonder", p: "/ˈwʌndər/", t: "задаваться вопросом", e: "I wonder why pizza boxes are square." },
  { w: "graze", p: "/ɡreɪz/", t: "слегка задеть", e: "Something grazed my foot in the ocean." },
  { w: "fade out", p: "/feɪd aʊt/", t: "затихать, угасать", e: "The song started to fade out." },
  { w: "soggy", p: "/ˈsɒɡi/", t: "раскисший, промокший", e: "I touched some soggy food in the sink." },
  { w: "pretend", p: "/prɪˈtɛnd/", t: "притворяться", e: "She pretended to be asleep." },
  { w: "identical", p: "/aɪˈdɛntɪkəl/", t: "одинаковый, идентичный", e: "The twins wore identical outfits." },
  { w: "permission", p: "/pərˈmɪʃən/", t: "разрешение", e: "You need permission from your parents." },
  { w: "mention", p: "/ˈmɛnʃən/", t: "упомянуть", e: "He mentioned his girlfriend casually." },
  { w: "adopt", p: "/əˈdɒpt/", t: "усыновить; принять", e: "They decided to adopt a child." },
  { w: "ghost", p: "/ɡoʊst/", t: "пропасть, игнорировать", e: "He ghosted her after three dates." },
  { w: "vibe", p: "/vaɪb/", t: "атмосфера, настроение", e: "This place has such a good vibe." },
  { w: "cringe", p: "/krɪndʒ/", t: "кринж, неловкость", e: "Looking at my old photos is so cringe." },
  { w: "overthink", p: "/ˌoʊvərˈθɪŋk/", t: "накручивать себя", e: "Stop overthinking — just send the message." },
  { w: "salty", p: "/ˈsɔːlti/", t: "обиженный (сленг)", e: "She's still salty about losing the game." },
  { w: "exaggerate", p: "/ɪɡˈzædʒəreɪt/", t: "преувеличивать", e: "He always exaggerates everything." },
  { w: "casual", p: "/ˈkæʒuəl/", t: "непринуждённый, небрежный", e: "She mentioned it in a very casual way." },
  { w: "loyalty", p: "/ˈlɔɪəlti/", t: "лояльность, верность", e: "He stayed because of their loyalty program." },
  { w: "orphanage", p: "/ˈɔːrfənɪdʒ/", t: "детский дом", e: "The kids at the orphanage got new toys." },
  { w: "seaweed", p: "/ˈsiːwiːd/", t: "морские водоросли", e: "Seaweed touched my foot in the ocean." },
];

let done = new Set();

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  words.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (done.has(i) ? ' done' : '');
    card.innerHTML = `
      <span class="check">✓</span>
      <div class="word">${item.w}</div>
      <div class="phonetic">${item.p}</div>
      <div class="translation">${item.t}</div>
      <div class="example">${item.e}</div>
    `;
    card.addEventListener('click', () => toggle(i));
    grid.appendChild(card);
  });
  updateCounter();
}

function toggle(i) {
  if (done.has(i)) done.delete(i);
  else done.add(i);
  save();
  render();
}

function updateCounter() {
  const n = done.size;
  const total = words.length;
  document.getElementById('counter').textContent = `${n} / ${total}`;
  document.getElementById('progress').style.width = `${(n/total)*100}%`;
  document.getElementById('allDone').style.display = n === total ? 'block' : 'none';
}

function resetAll() {
  done.clear();
  save();
  render();
}

function save() {
  try { localStorage.setItem('alias_done', JSON.stringify([...done])); } catch(e) {}
}

function load() {
  try {
    const s = localStorage.getItem('alias_done');
    if (s) done = new Set(JSON.parse(s));
  } catch(e) {}
}

load();
render();
</script>
</body>
</html>
